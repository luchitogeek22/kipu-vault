name: KipuVault CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  anchor-phase1:
    name: Phase 1 — Anchor Build & 20 Bankrun Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential pkg-config libudev-dev libssl-dev llvm clang curl git

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust 1.79.0
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Restore Cargo & Anchor CLI Cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
          key: ${{ runner.os }}-solana-1.18.26-anchor-0.30.1-rust-1.79.0-v2

      - name: Install Solana CLI 1.18.26
        run: |
          if ! [ -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/solana"
          if [ ! -f "$HOME/.config/solana/id.json" ]; then
            "$HOME/.local/share/solana/install/active_release/bin/solana-keygen" new \
              --no-bip39-passphrase --silent --outfile "$HOME/.config/solana/id.json"
          fi

      - name: Install Anchor CLI 0.30.1
        run: |
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked
          fi
          anchor --version
          solana --version
          rustc --version

      - name: Save Cargo & Anchor CLI Cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
          key: ${{ runner.os }}-solana-1.18.26-anchor-0.30.1-rust-1.79.0-v2

      - name: Install JS test dependencies
        run: npm ci

      - name: Anchor Build & IDL Check
        run: |
          anchor build
          test -f target/idl/kipu_vault.json
          test -f target/deploy/kipu_vault.so

      - name: Anchor Test (20 anchor-bankrun cases)
        run: anchor test --skip-local-validator

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: kipu-vault-idl
          path: target/idl/kipu_vault.json

  backend-and-postgres-phase2:
    name: Phase 2 — Supabase Schema on Empty Postgres & Backend Checks
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kipu
          POSTGRES_PASSWORD: kipu_ci_password
          POSTGRES_DB: kipu_empty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply supabase/schema.sql on empty Postgres 16
        env:
          PGPASSWORD: kipu_ci_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U kipu -d kipu_empty -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h 127.0.0.1 -U kipu -d kipu_empty -v ON_ERROR_STOP=1 -c "\dt"
          psql -h 127.0.0.1 -U kipu -d kipu_empty -v ON_ERROR_STOP=1 -c "
            INSERT INTO audit_logs (nonce, vault_address, owner_wallet, mode, status, canonical_json, decision_hash)
            VALUES (gen_random_uuid(), 'Vault111', 'Owner111', 'standard', 'PENDING', '{}', repeat('a', 64));
            UPDATE audit_logs SET status = 'EXECUTED' WHERE vault_address = 'Vault111';
          "

      - name: Setup Python 3.12 & Node 22
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest, ruff, and mypy
        run: |
          pytest backend -q
          ruff check backend
          mypy --config-file backend/pyproject.toml backend/app

  frontend-phase3:
    name: Phase 3 — Frontend Lint & Next.js Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps, lint, and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

[package]
name = "kipu_vault"
version = "0.1.0"
description = "KipuVault: Solana Smart Vault with on-chain guardrails for AI payment agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kipu_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["associated_token", "mint", "token", "token_2022", "token_2022_extensions", "solana-v4"] }

[package]
name = "kipu_vault"
version = "0.1.0"
description = "KipuVault: Solana Smart Vault with on-chain guardrails for AI payment agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kipu_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = "=0.30.1"

[dev-dependencies]
blake3 = "=1.5.5"
zeroize_derive = "=1.4.3"
proc-macro-crate = "=3.2.0"
jobserver = "=0.1.34"
toml_edit = "=0.22.22"
toml = "=0.8.19"
ahash = "=0.8.11"
getrandom = "=0.3.3"
wasi = "=0.14.2"
wit-bindgen-rt = "=0.44.0"
indexmap = "=2.11.4"
hashbrown = "=0.15.5"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
borsh = "=1.5.7"
borsh-derive = "=1.5.7"
unicode-segmentation = "=1.12.0"
web-sys = "=0.3.94"
proc-macro2 = "=1.0.94"

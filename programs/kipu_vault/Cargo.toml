[package]
name = "kipu_vault"
version = "0.1.0"
description = "KipuVault: Solana Smart Vault with on-chain guardrails for AI payment agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kipu_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = "=0.30.1"
blake3 = "=1.5.5"

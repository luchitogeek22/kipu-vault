[package]
name = "kipu_vault"
version = "0.1.0"
description = "KipuVault: Solana Smart Vault with on-chain guardrails for AI payment agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kipu_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = "=0.30.1"

[dev-dependencies]
blake3 = "=1.5.5"
zeroize_derive = "=1.4.3"
proc-macro-crate = "=3.4.0"
jobserver = "=0.1.34"

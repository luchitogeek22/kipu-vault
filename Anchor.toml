[toolchain]
anchor_version = "1.2.1"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
kipu_vault = "KipuVau1t1111111111111111111111111111111111"

[programs.devnet]
kipu_vault = "KipuVau1t1111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "node --no-experimental-strip-types ./node_modules/mocha/bin/mocha.js --require ts-node/register -t 1000000 tests/**/*.ts"
